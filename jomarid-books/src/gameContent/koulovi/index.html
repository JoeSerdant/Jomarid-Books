<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kouloví Kámoši</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
<script>/* JOMARID-BRIDGE */
(function () {
  var GAME_ID = 'koulovikamosi';
  var inFrame = false;
  try { inFrame = !!window.parent && window.parent !== window; } catch (e) { inFrame = false; }
  var pending = 0, reasons = {}, timer = null;

  function flush() {
    timer = null;
    if (!pending || !inFrame) { pending = 0; reasons = {}; return; }
    var top = 'event', topAmt = 0;
    for (var k in reasons) { if (reasons[k] > topAmt) { top = k; topAmt = reasons[k]; } }
    var amount = pending; pending = 0; reasons = {};
    try { window.parent.postMessage({ source: 'jomarid-game', type: 'coin', game: GAME_ID, amount: amount, reason: top }, '*'); } catch (e) {}
  }

  // Hra jen POSILA ZADOST o odmenu - o tom, kolik Jomarid Coins se skutecne udeli,
  // rozhoduje server (denni stropy). Vice udalosti v rychlem sledu se sloucí do jedne zpravy.
  // Potvrzení odměny (kolik se skutečně připsalo) ukazuje lišta appky nad hrou, hra samotná nic nezobrazuje.
  window.jomaridReward = function (reason, amount, immediate) {
    if (!inFrame) return;
    amount = Math.floor(Number(amount));
    if (!isFinite(amount) || amount < 1) return;
    var r = reason || 'event';
    pending += amount;
    reasons[r] = (reasons[r] || 0) + amount;
    if (immediate) { if (timer) clearTimeout(timer); flush(); }
    else if (!timer) { timer = setTimeout(flush, 1200); }
  };

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.source !== 'jomarid-host') return;
    if (ev.source !== window.parent) return;
    // Zůstatek Jomarid Coins z účtu (appka ho posílá po načtení hry a po každé změně); hra ho jen zobrazuje.
    if (d.type === 'balance') {
      if (typeof d.balance === 'number' && isFinite(d.balance)) { window.jomaridBalance = d.balance; if (window.onJomaridBalance) window.onJomaridBalance(); }
      return;
    }
  });

  // Rekordy hry (nejlepší skóre, nejvyšší úroveň...): hra jen hlásí aktuální hodnotu, o zápisu a odznacích rozhoduje server.
  // Hlásí se jen zvýšení oproti naposledy odeslanému (stejná nebo nižší hodnota se neposílá znovu) a víc hlášení v rychlém sledu se sloučí.
  var recSent = {}, recPending = {}, recTimer = null;
  function recFlush() {
    recTimer = null;
    var pend = recPending; recPending = {};
    if (!inFrame) return;
    for (var k in pend) {
      if (pend[k] <= (recSent[k] || 0)) continue;
      recSent[k] = pend[k];
      try { window.parent.postMessage({ source: 'jomarid-game', type: 'record', game: GAME_ID, stat: k, value: pend[k] }, '*'); } catch (e) {}
    }
  }
  window.jomaridRecord = function (stat, value, immediate) {
    if (!inFrame || typeof stat !== 'string') return;
    value = Math.floor(Number(value));
    if (!isFinite(value) || value < 1) return;
    if (value <= (recSent[stat] || 0) || value <= (recPending[stat] || 0)) return;
    recPending[stat] = value;
    if (immediate) { if (recTimer) clearTimeout(recTimer); recFlush(); }
    else if (!recTimer) { recTimer = setTimeout(recFlush, 1500); }
  };

  window.addEventListener('pagehide', function () { if (timer) clearTimeout(timer); flush(); if (recTimer) clearTimeout(recTimer); recFlush(); });
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('#btn-back-to-jomarid') : null;
    if (t) { if (timer) clearTimeout(timer); flush(); if (recTimer) clearTimeout(recTimer); recFlush(); }
  }, true);
})();
</script>
</head>
<body>
<div id="stage">
<canvas id="c" width="540" height="960"></canvas>
<div id="menu" class="ov">
 <h1>Kouloví<br>Kámoši</h1>
 <div class="mas" id="mas"></div><div style="font-size:1.8em">🪙 <b id="cn">0</b></div><div id="jb" class="hide" style="font-size:1.3em;margin-top:-.5em" title="Jomarid Coins">🔶 <b id="jbn">0</b> <span style="font-size:.6em;opacity:.8">Jomarid Coins</span></div>
 <div class="stats"><h2>MOJE STATISTIKY</h2>
  <div class="row"><div><b id="sT">0</b><i>Dnes</i></div><div><b id="sW">0</b><i>Tento týden</i></div><div><b id="sA">0</b><i>Celkem</i></div></div>
  <div class="small">Her: <span id="sG">0</span> · Sloučení: <span id="sM">0</span></div></div>
 <button id="cont" class="hide" style="background:#5be04a;font-size:1.8em">Pokračovat</button><button id="play">Hrát</button><button id="shopb" class="sec">Obchod</button><button id="snd" class="sec" style="font-size:1.1em">🔊</button>
</div>
<div id="modes" class="ov hide"><h1 style="font-size:3em">Herní módy</h1><div id="ml" class="stats" style="background:#2f95ea;width:22em"></div><button id="mback" class="sec">Zpět</button></div>
<div id="shop" class="ov hide"><h1 style="font-size:3em">Obchod</h1><div style="font-size:1.8em">🪙 <b id="cn2">0</b></div><div id="items" class="stats" style="background:#2f95ea"></div><button id="shopx" class="sec">Zpět</button></div>
<div id="over" class="ov over hide">
 <h1 id="oT" style="font-size:3.4em">Konec hry</h1>
 <div style="font-size:2.4em">Skóre: <b id="oS">0</b></div>
 <div id="oB" style="font-size:1.6em;color:#ffd92e"></div>
 <button id="again">Znovu</button><button id="tomenu" class="sec">Menu</button>
</div>
</div>
<!--__SCRIPTS__-->
</body>
</html>
