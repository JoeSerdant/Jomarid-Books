<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Chess League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  #root { height: 100%; }
</style>
<script>
  /* uvnitř aplikace (iframe) se hra přizpůsobí: schová vlastní odkaz zpět a udělá místo tlačítku zavření */
  try { document.documentElement.classList.add(window.parent !== window ? "embedded" : "standalone"); } catch (e) { document.documentElement.classList.add("standalone"); }
</script>
<style>
/*__CSS__*/
</style>
<script>/* JOMARID-BRIDGE */
(function () {
  var GAME_ID = 'chess';
  var inFrame = false;
  try { inFrame = !!window.parent && window.parent !== window; } catch (e) { inFrame = false; }
  var pending = 0, reasons = {}, timer = null, capNotified = false;

  function toast(text, warn) {
    try {
      var el = document.createElement('div');
      el.textContent = text;
      el.setAttribute('style', 'position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:2147483000;pointer-events:none;padding:9px 16px;border-radius:999px;font:800 13px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.3px;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.35);color:' + (warn ? '#e5e7eb' : '#1a1200') + ';background:' + (warn ? 'rgba(55,65,81,.95)' : 'linear-gradient(135deg,#ffd76a,#f59e0b)') + ';');
      document.documentElement.appendChild(el);
      requestAnimationFrame(function () { el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)'; });
      setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300); }, 2600);
    } catch (e) {}
  }

  function flush() {
    timer = null;
    if (!pending || !inFrame) { pending = 0; reasons = {}; return; }
    var top = 'event', topAmt = 0;
    for (var k in reasons) { if (reasons[k] > topAmt) { top = k; topAmt = reasons[k]; } }
    var amount = pending; pending = 0; reasons = {};
    try { window.parent.postMessage({ source: 'jomarid-game', type: 'coin', game: GAME_ID, amount: amount, reason: top }, '*'); } catch (e) {}
  }

  // Hra jen POSILA ZADOST o odmenu - o tom, kolik Jomarid Coins se skutecne udeli,
  // rozhoduje server (denni stropy). Vice udalosti v rychlem sledu se sloucí do jedne zpravy.
  window.jomaridReward = function (reason, amount, immediate) {
    if (!inFrame) return;
    amount = Math.floor(Number(amount));
    if (!isFinite(amount) || amount < 1) return;
    var r = reason || 'event';
    pending += amount;
    reasons[r] = (reasons[r] || 0) + amount;
    if (immediate) { if (timer) clearTimeout(timer); flush(); }
    else if (!timer) { timer = setTimeout(flush, 1200); }
  };

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.source !== 'jomarid-host' || d.type !== 'coin-result') return;
    if (ev.source !== window.parent) return;
    if (d.granted > 0) toast('\uD83D\uDD36 +' + d.granted + ' Jomarid Coins');
    else if (d.capped && !capNotified) { capNotified = true; toast('\uD83D\uDD36 Denn\u00ED limit odm\u011Bn z t\u00E9to hry je vy\u010Derp\u00E1n', true); }
  });

  window.addEventListener('pagehide', function () { if (timer) clearTimeout(timer); flush(); });
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('#btn-back-to-jomarid') : null;
    if (t) { if (timer) clearTimeout(timer); flush(); }
  }, true);
})();
</script>

</head>
<body>
<a href="/games" id="btn-back-to-jomarid" onclick="if (window.parent !== window) { window.parent.postMessage({ source: 'jomarid-game', type: 'close' }, '*'); return false; }" style="position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:10px; z-index:9999; color:#94a3b8; font-size:11px; letter-spacing:0.5px; text-decoration:none; background:rgba(2,6,23,0.75); padding:6px 10px; border-radius:8px; border:1px solid #1e293b; backdrop-filter: blur(4px); font-family: 'Nunito', sans-serif;">← Jomarid Books</a>
<div id="root"></div>
<!--__REACT__-->
<!--__SCRIPTS__-->
</body>
</html>
