<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Polygon aréna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
<script>/* JOMARID-BRIDGE */
(function () {
  var GAME_ID = 'polygonarena';
  var inFrame = false;
  try { inFrame = !!window.parent && window.parent !== window; } catch (e) { inFrame = false; }
  var pending = 0, reasons = {}, timer = null, capNotified = false;

  function toast(text, warn) {
    try {
      var el = document.createElement('div');
      el.textContent = text;
      el.setAttribute('style', 'position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:2147483000;pointer-events:none;padding:9px 16px;border-radius:999px;font:800 13px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.3px;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.35);color:' + (warn ? '#e5e7eb' : '#1a1200') + ';background:' + (warn ? 'rgba(55,65,81,.95)' : 'linear-gradient(135deg,#ffd76a,#f59e0b)') + ';');
      document.documentElement.appendChild(el);
      requestAnimationFrame(function () { el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(0)'; });
      setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300); }, 2600);
    } catch (e) {}
  }

  function flush() {
    timer = null;
    if (!pending || !inFrame) { pending = 0; reasons = {}; return; }
    var top = 'event', topAmt = 0;
    for (var k in reasons) { if (reasons[k] > topAmt) { top = k; topAmt = reasons[k]; } }
    var amount = pending; pending = 0; reasons = {};
    try { window.parent.postMessage({ source: 'jomarid-game', type: 'coin', game: GAME_ID, amount: amount, reason: top }, '*'); } catch (e) {}
  }

  // Hra jen POSILA ZADOST o odmenu - o tom, kolik Jomarid Coins se skutecne udeli,
  // rozhoduje server (denni stropy). Vice udalosti v rychlem sledu se sloucí do jedne zpravy.
  window.jomaridReward = function (reason, amount, immediate) {
    if (!inFrame) return;
    amount = Math.floor(Number(amount));
    if (!isFinite(amount) || amount < 1) return;
    var r = reason || 'event';
    pending += amount;
    reasons[r] = (reasons[r] || 0) + amount;
    if (immediate) { if (timer) clearTimeout(timer); flush(); }
    else if (!timer) { timer = setTimeout(flush, 1200); }
  };

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.source !== 'jomarid-host' || d.type !== 'coin-result') return;
    if (ev.source !== window.parent) return;
    if (d.granted > 0) toast('\uD83D\uDD36 +' + d.granted + ' Jomarid Coins');
    else if (d.capped && !capNotified) { capNotified = true; toast('\uD83D\uDD36 Denn\u00ED limit odm\u011Bn z t\u00E9to hry je vy\u010Derp\u00E1n', true); }
  });

  window.addEventListener('pagehide', function () { if (timer) clearTimeout(timer); flush(); });
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('#btn-back-to-jomarid') : null;
    if (t) { if (timer) clearTimeout(timer); flush(); }
  }, true);
})();
</script>

</head>
<body>
<a href="/games" id="btn-back-to-jomarid" onclick="try { var a = document.documentElement.__arena; if (a && a.save) localStorage.setItem('polygon-arena-v1', JSON.stringify(a.save)); } catch (e) {} if (window.parent !== window) { window.parent.postMessage({ source: 'jomarid-game', type: 'close' }, '*'); return false; }" style="position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:10px; z-index:9999; color:#94a3b8; font-size:11px; letter-spacing:0.5px; text-decoration:none; background:rgba(2,6,23,0.75); padding:6px 10px; border-radius:8px; border:1px solid #1e293b; backdrop-filter: blur(4px); font-family: 'Chakra Petch', sans-serif;">← Jomarid Books</a>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <canvas id="mini" width="192" height="192"></canvas>
    <div id="feed"></div>
    <div id="lb" class="panel"></div>
    <div id="topbtns">
      <button id="autoBtn" class="chip pe" aria-pressed="false" title="Automatické míření a střelba (E)">Auto</button>
      <button id="clsBtn" class="chip pe hidden" title="Výběr třídy (C)">Třídy</button>
      <button id="pauseBtn" class="chip pe" aria-label="Pauza" title="Pauza (P)"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.6" height="12" rx="1"/><rect x="8.4" y="1" width="3.6" height="12" rx="1"/></svg></button>
    </div>
    <div id="banner"></div>
    <div id="objbar" class="panel hidden"></div>
    <div id="bossbar" class="panel hidden"><b id="bossName"></b><div class="bar"><i id="bossFill"></i></div></div>
    <div id="stats" class="panel pe"><div id="statHead" class="pe"></div><div id="statRows"></div></div>
    <div id="classes"></div>
    <div id="perkStrip"></div>
    <button id="dashBtn" class="pe" type="button" aria-label="Skok (Shift)"><svg viewBox="0 0 24 24"><path d="M13.5 2L5 13.5h5.5L9.5 22 19 9.5h-5.7z"/></svg><span id="dashTxt">Skok</span></button>
    <div id="xp" class="panel">
      <div id="xpMeta"><span id="lvlText"></span><span id="scoreText"></span></div>
      <div id="xpBar"><i id="xpFill"></i></div>
    </div>
  </div>

  <div id="menu" class="overlay">
    <div class="card">
      <svg class="logo" viewBox="0 0 74 44" aria-hidden="true">
        <polygon points="14,4 26,4 26,16 14,16" fill="#f0c14b" stroke="#a5822a" stroke-width="2.4" stroke-linejoin="round" transform="rotate(-12 20 10)"/>
        <polygon points="36,36 48,15 60,36" fill="#ea6f69" stroke="#a03f3a" stroke-width="2.4" stroke-linejoin="round"/>
        <polygon points="15,25 23,23 30,29 26,38 16,38 11,31" fill="#8f88ea" stroke="#5a53ae" stroke-width="2.4" stroke-linejoin="round" transform="translate(-4 -3)"/>
      </svg>
      <h1>Polygon aréna</h1>
      <p class="lead">Rozstřílej tvary, poskládej si stavbu tanku a přežij mezi chytrými boty. Bez internetu, bez čekání.</p>
      <label class="field" for="nameIn">Jméno</label>
      <input id="nameIn" class="input" maxlength="14" placeholder="Tvoje přezdívka" autocomplete="off" spellcheck="false">
      <div class="field" id="modeLabel">Režim</div>
      <div class="mgrid" id="modeSeg" role="radiogroup" aria-labelledby="modeLabel"></div>
      <p class="dinfo" id="modeInfo"></p>
      <div class="field" id="diffLabel">Obtížnost botů</div>
      <div class="seg" id="diffSeg" role="radiogroup" aria-labelledby="diffLabel">
        <button type="button" role="radio" data-d="easy">Lehká</button>
        <button type="button" role="radio" data-d="normal">Střední</button>
        <button type="button" role="radio" data-d="hard">Těžká</button>
        <button type="button" role="radio" data-d="hell">Peklo</button>
      </div>
      <p class="dinfo" id="diffInfo"></p>
      <button id="playBtn" class="btn" type="button">Hrát</button>
      <div class="row two"><button id="collBtn" type="button">Sbírka a úspěchy</button><button id="setBtn" type="button">Nastavení</button></div>
      <div class="row"><span id="bestText"></span><button id="soundBtn" type="button">Zvuk: vypnutý</button></div>
      <p class="hint" id="hintText"></p>
    </div>
  </div>

  <div id="dead" class="overlay hidden">
    <div class="card">
      <p class="big" id="deadTitle">Byl jsi zničen</p>
      <p class="lead" id="deadBy"></p>
      <div id="newBest" class="newbest hidden">Nový osobní rekord</div>
      <div class="grid2" id="deadGrid">
        <div><b id="dLvl">1</b><span>Úroveň</span></div>
        <div><b id="dScore">0</b><span>Skóre</span></div>
        <div><b id="dKills">0</b><span>Zničených tanků</span></div>
        <div><b id="dTime">0:00</b><span>Přežito</span></div>
      </div>
      <button id="againBtn" class="btn" type="button">Hrát znovu</button>
      <button id="deadMenuBtn" class="btn ghost" type="button">Menu</button>
    </div>
  </div>

  <div id="coll" class="overlay hidden">
    <div class="card wide">
      <div class="collhead"><b id="collTitle">Sbírka</b><button id="collClose" class="chip" type="button">Zavřít</button></div>
      <div class="tabs" id="collTabs"></div>
      <div id="collBody"></div>
    </div>
  </div>

  <div id="settings" class="overlay hidden">
    <div class="card">
      <p class="big">Nastavení</p>
      <div id="setBody"></div>
      <button id="setClose" class="btn" type="button">Hotovo</button>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="card">
      <p class="big">Pauza</p>
      <p class="lead">Hra stojí. Boti čekají.</p>
      <button id="resumeBtn" class="btn" type="button">Pokračovat</button>
      <button id="pauseMenuBtn" class="btn ghost" type="button">Ukončit hru</button>
    </div>
  </div>
</div>

<!--__SCRIPTS__-->
</body>
</html>
